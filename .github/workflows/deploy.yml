name: Build y Deploy BrainWSP

on:
    push:
        branches: [main]
        paths-ignore:
            - "docs/**"
            - "scripts/**"
            - "**.md"
    workflow_dispatch:

env:
    # Dominios del despliegue. Cambiar aqui si migras de dominio.
    APP_HOST: wsp.braintech.pe
    API_HOST: api.wsp.braintech.pe
    # Prefijo de las imagenes en GitHub Container Registry (debe ir en minusculas)
    IMAGE_PREFIX: ghcr.io/jhorimo/brainwsp

jobs:
    build:
        name: Construir imagenes
        runs-on: ubuntu-24.04
        permissions:
            contents: read
            packages: write
        steps:
            - name: Descargar codigo
              uses: actions/checkout@v4

            - name: Preparar Buildx
              uses: docker/setup-buildx-action@v3

            - name: Autenticar en GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Imagen API
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: apps/api/Dockerfile
                  push: true
                  tags: |
                      ${{ env.IMAGE_PREFIX }}-api:latest
                      ${{ env.IMAGE_PREFIX }}-api:${{ github.sha }}
                  cache-from: type=gha,scope=api
                  cache-to: type=gha,mode=max,scope=api

            - name: Imagen Worker
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: apps/worker/Dockerfile
                  push: true
                  tags: |
                      ${{ env.IMAGE_PREFIX }}-worker:latest
                      ${{ env.IMAGE_PREFIX }}-worker:${{ github.sha }}
                  cache-from: type=gha,scope=worker
                  cache-to: type=gha,mode=max,scope=worker

            - name: Imagen Web
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: apps/web/Dockerfile
                  push: true
                  build-args: |
                      NEXT_PUBLIC_API_URL=https://${{ env.API_HOST }}/api
                      NEXT_PUBLIC_SOCKET_URL=https://${{ env.API_HOST }}
                  tags: |
                      ${{ env.IMAGE_PREFIX }}-web:latest
                      ${{ env.IMAGE_PREFIX }}-web:${{ github.sha }}
                  cache-from: type=gha,scope=web
                  cache-to: type=gha,mode=max,scope=web

    deploy:
        name: Desplegar en servidor
        needs: build
        runs-on: ubuntu-24.04
        steps:
            - name: Actualizar contenedores por SSH
              uses: appleboy/ssh-action@v1
              with:
                  host: ${{ secrets.SSH_HOST }}
                  username: ${{ secrets.SSH_USER }}
                  key: ${{ secrets.SSH_KEY }}
                  port: ${{ secrets.SSH_PORT || 22 }}
                  script: |
                      set -e
                      cd /root/mipse/brainwsp
                      COMPOSE="docker compose -f docker-compose.prod.yml"

                      # 1. Anotar que imagenes estan corriendo ahora, para poder volver.
                      PREV_API=$(docker inspect --format '{{.Image}}' brainwsp-api-1 2>/dev/null || true)
                      PREV_WEB=$(docker inspect --format '{{.Image}}' brainwsp-web-1 2>/dev/null || true)
                      PREV_WRK=$(docker inspect --format '{{.Image}}' brainwsp-worker-1 2>/dev/null || true)
                      echo "Version actual -> api=$PREV_API web=$PREV_WEB worker=$PREV_WRK"

                      $COMPOSE pull

                      # 2. Aplicar el esquema en un contenedor aparte.
                      #    Si falla, salimos aqui y los contenedores viejos siguen sirviendo.
                      echo "--- Aplicando esquema de base de datos ---"
                      if ! $COMPOSE run --rm api sh -c "npx prisma db push --schema packages/database/schema.prisma"; then
                          echo "ERROR: el esquema no se pudo aplicar. No se toca produccion."
                          exit 1
                      fi

                      # 3. Recien ahora reemplazamos los contenedores.
                      $COMPOSE up -d

                      # 4. Esperar hasta 2 minutos a que la API quede saludable.
                      echo "--- Esperando a que la API responda ---"
                      ESTADO=""
                      for i in $(seq 1 24); do
                          ESTADO=$(docker inspect --format '{{.State.Health.Status}}' brainwsp-api-1 2>/dev/null || echo "ausente")
                          [ "$ESTADO" = "healthy" ] && break
                          sleep 5
                      done

                      # 5. Si no arranco, volver a la version anterior.
                      if [ "$ESTADO" != "healthy" ]; then
                          echo "ERROR: la API no quedo saludable (estado: $ESTADO). Revirtiendo."
                          docker logs --tail 40 brainwsp-api-1 || true

                          if [ -n "$PREV_API" ]; then
                              docker tag "$PREV_API" ghcr.io/jhorimo/brainwsp-api:latest
                              [ -n "$PREV_WEB" ] && docker tag "$PREV_WEB" ghcr.io/jhorimo/brainwsp-web:latest
                              [ -n "$PREV_WRK" ] && docker tag "$PREV_WRK" ghcr.io/jhorimo/brainwsp-worker:latest
                              $COMPOSE up -d
                              echo "Revertido a la version anterior."
                          else
                              echo "No habia version anterior registrada; no se pudo revertir."
                          fi
                          exit 1
                      fi

                      echo "--- Despliegue correcto ---"
                      docker image prune -f
                      $COMPOSE ps
