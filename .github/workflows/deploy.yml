name: Build y Deploy BrainWSP

on:
    push:
        branches: [main]
        paths-ignore:
            - "docs/**"
            - "scripts/**"
            - "**.md"
    workflow_dispatch:

env:
    # Dominios del despliegue. Cambiar aqui si migras de dominio.
    APP_HOST: wsp.braintech.pe
    API_HOST: api.wsp.braintech.pe
    # Prefijo de las imagenes en GitHub Container Registry (debe ir en minusculas)
    IMAGE_PREFIX: ghcr.io/jhorimo/brainwsp

jobs:
    build:
        name: Construir imagenes
        runs-on: ubuntu-24.04
        permissions:
            contents: read
            packages: write
        outputs:
            worker_changed: ${{ steps.cambios.outputs.worker_changed }}
        steps:
            - name: Descargar codigo
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            # Reiniciar el worker desconecta TODAS las lineas de WhatsApp un momento. Solo se
            # reconstruye y se reinicia si cambio algo que afecta al worker; si no, el deploy
            # actualiza solo API y web. Ante la duda (push manual, primer push, historial raro) si.
            - name: Detectar cambios del worker
              id: cambios
              run: |
                  BEFORE="${{ github.event.before }}"
                  if [ "${{ github.event_name }}" != "push" ] || [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
                      echo "worker_changed=true" >> "$GITHUB_OUTPUT"; exit 0
                  fi
                  if git diff --name-only "$BEFORE" "${{ github.sha }}" | grep -qE '^(apps/worker/|packages/|package\.json$|package-lock\.json$)'; then
                      echo "worker_changed=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "worker_changed=false" >> "$GITHUB_OUTPUT"
                  fi
                  git diff --name-only "$BEFORE" "${{ github.sha }}"

            - name: Preparar Buildx
              uses: docker/setup-buildx-action@v3

            - name: Autenticar en GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Imagen API
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: apps/api/Dockerfile
                  push: true
                  tags: |
                      ${{ env.IMAGE_PREFIX }}-api:latest
                      ${{ env.IMAGE_PREFIX }}-api:${{ github.sha }}
                  cache-from: type=gha,scope=api
                  cache-to: type=gha,mode=max,scope=api

            - name: Imagen Worker
              if: steps.cambios.outputs.worker_changed == 'true'
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: apps/worker/Dockerfile
                  push: true
                  tags: |
                      ${{ env.IMAGE_PREFIX }}-worker:latest
                      ${{ env.IMAGE_PREFIX }}-worker:${{ github.sha }}
                  cache-from: type=gha,scope=worker
                  cache-to: type=gha,mode=max,scope=worker

            - name: Imagen Web
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: apps/web/Dockerfile
                  push: true
                  build-args: |
                      NEXT_PUBLIC_API_URL=https://${{ env.API_HOST }}/api
                      NEXT_PUBLIC_SOCKET_URL=https://${{ env.API_HOST }}
                      NEXT_PUBLIC_SITE_URL=https://${{ env.APP_HOST }}
                  tags: |
                      ${{ env.IMAGE_PREFIX }}-web:latest
                      ${{ env.IMAGE_PREFIX }}-web:${{ github.sha }}
                  cache-from: type=gha,scope=web
                  cache-to: type=gha,mode=max,scope=web

    deploy:
        name: Desplegar en servidor
        needs: build
        runs-on: ubuntu-24.04
        steps:
            - name: Actualizar contenedores por SSH
              uses: appleboy/ssh-action@v1
              with:
                  host: ${{ secrets.SSH_HOST }}
                  username: ${{ secrets.SSH_USER }}
                  key: ${{ secrets.SSH_KEY }}
                  port: ${{ secrets.SSH_PORT || 22 }}
                  script: |
                      set -e
                      cd /root/mipse/brainwsp
                      COMPOSE="docker compose -f docker-compose.prod.yml"
                      WORKER_CHANGED="${{ needs.build.outputs.worker_changed }}"
                      if [ "$WORKER_CHANGED" = "true" ]; then SERVICES="api web worker"; else SERVICES="api web"; fi
                      echo "Servicios a actualizar: $SERVICES"


                      # Solo las imagenes propias. postgres/redis van fijadas por tag y minio
                      # ya esta en el servidor: quay.io/minio/minio devuelve "unauthorized"
                      # (MinIO dejo de publicarla) y un solo pull fallido aborta el despliegue.
                      $COMPOSE pull $SERVICES

                      # 2. Aplicar las migraciones en un contenedor aparte (mismo script que
                      #    corre el CMD del contenedor api, ver packages/database/migrate-deploy.sh).
                      #    Si falla, salimos aqui y los contenedores viejos siguen sirviendo.
                      echo "--- Aplicando migraciones de base de datos ---"
                      if ! $COMPOSE run --rm api sh packages/database/migrate-deploy.sh; then
                          echo "ERROR: las migraciones no se pudieron aplicar. No se toca produccion."
                          exit 1
                      fi

                      # 3. Reemplazo SIN CORTE para api y web: se levanta un 2º contenedor con
                      #    la imagen nueva al lado del viejo (nginx-proxy reparte entre ambos
                      #    porque comparten VIRTUAL_HOST), se espera a que responda y recien
                      #    ahi se apaga el viejo. Si el nuevo no arranca, se borra y el viejo
                      #    sigue atendiendo: el rollback es automatico y sin corte.
                      sano() { # $1 = id del contenedor, $2 = servicio
                          if [ "$2" = "api" ]; then
                              [ "$(docker inspect --format '{{.State.Health.Status}}' "$1" 2>/dev/null)" = "healthy" ]
                          else
                              docker exec "$1" sh -c 'wget -qO- -T 3 http://127.0.0.1:3000/login >/dev/null' 2>/dev/null
                          fi
                      }
                      rolling() { # $1 = servicio
                          SVC="$1"
                          OLD=$(docker ps -q -f "label=com.docker.compose.project=brainwsp" -f "label=com.docker.compose.service=$SVC")
                          echo "--- Actualizando $SVC sin corte (viejo: ${OLD:-ninguno}) ---"
                          $COMPOSE up -d --no-deps --no-recreate --scale "$SVC=2" "$SVC"
                          NEW=$(docker ps -q -f "label=com.docker.compose.project=brainwsp" -f "label=com.docker.compose.service=$SVC" | grep -v -F "${OLD:-__none__}" | head -1 || true)
                          if [ -z "$NEW" ]; then echo "ERROR: no se creo el contenedor nuevo de $SVC."; return 1; fi
                          for i in $(seq 1 24); do sano "$NEW" "$SVC" && break; sleep 5; done
                          if ! sano "$NEW" "$SVC"; then
                              echo "ERROR: $SVC nuevo no respondio. Se borra; el viejo sigue atendiendo."
                              docker logs --tail 40 "$NEW" || true
                              docker rm -f "$NEW" >/dev/null
                              return 1
                          fi
                          # El nuevo ya esta en el proxy; damos unos segundos a nginx para
                          # recargar antes de quitar el viejo.
                          sleep 5
                          if [ -n "$OLD" ]; then docker stop -t 30 $OLD >/dev/null && docker rm $OLD >/dev/null; fi
                          echo "$SVC actualizado: $(docker ps --format '{{.Names}}' -f id=$NEW)"
                      }

                      rolling api || { echo "Despliegue abortado: produccion sigue con la version anterior."; exit 1; }
                      rolling web || { echo "Despliegue abortado en web: api ya nueva, web sigue con la anterior."; exit 1; }

                      # 4. El worker solo se reinicia si su codigo cambio (apagado ordenado,
                      #    sin pedir QR). Un solo worker siempre: dos a la vez pelearian las sesiones.
                      if [ "$WORKER_CHANGED" = "true" ]; then
                          $COMPOSE up -d --no-deps worker
                      fi

                      echo "--- Despliegue correcto ---"
                      docker image prune -f
                      $COMPOSE ps
