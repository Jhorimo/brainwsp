name: Build y Deploy BrainWSP

on:
    push:
        branches: [main]
        paths-ignore:
            - "docs/**"
            - "scripts/**"
            - "**.md"
    workflow_dispatch:

env:
    # Dominios del despliegue. Cambiar aqui si migras de dominio.
    APP_HOST: wsp.braintech.pe
    API_HOST: api.wsp.braintech.pe
    # Prefijo de las imagenes en GitHub Container Registry (debe ir en minusculas)
    IMAGE_PREFIX: ghcr.io/jhorimo/brainwsp

jobs:
    build:
        name: Construir imagenes
        runs-on: ubuntu-24.04
        permissions:
            contents: read
            packages: write
        steps:
            - name: Descargar codigo
              uses: actions/checkout@v4

            - name: Preparar Buildx
              uses: docker/setup-buildx-action@v3

            - name: Autenticar en GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Imagen API
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: apps/api/Dockerfile
                  push: true
                  tags: |
                      ${{ env.IMAGE_PREFIX }}-api:latest
                      ${{ env.IMAGE_PREFIX }}-api:${{ github.sha }}
                  cache-from: type=gha,scope=api
                  cache-to: type=gha,mode=max,scope=api

            - name: Imagen Worker
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: apps/worker/Dockerfile
                  push: true
                  tags: |
                      ${{ env.IMAGE_PREFIX }}-worker:latest
                      ${{ env.IMAGE_PREFIX }}-worker:${{ github.sha }}
                  cache-from: type=gha,scope=worker
                  cache-to: type=gha,mode=max,scope=worker

            - name: Imagen Web
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: apps/web/Dockerfile
                  push: true
                  build-args: |
                      NEXT_PUBLIC_API_URL=https://${{ env.API_HOST }}/api
                      NEXT_PUBLIC_SOCKET_URL=https://${{ env.API_HOST }}
                  tags: |
                      ${{ env.IMAGE_PREFIX }}-web:latest
                      ${{ env.IMAGE_PREFIX }}-web:${{ github.sha }}
                  cache-from: type=gha,scope=web
                  cache-to: type=gha,mode=max,scope=web

    deploy:
        name: Desplegar en servidor
        needs: build
        runs-on: ubuntu-24.04
        steps:
            - name: Actualizar contenedores por SSH
              uses: appleboy/ssh-action@v1
              with:
                  host: ${{ secrets.SSH_HOST }}
                  username: ${{ secrets.SSH_USER }}
                  key: ${{ secrets.SSH_KEY }}
                  port: ${{ secrets.SSH_PORT || 22 }}
                  script: |
                      set -e
                      cd /root/mipse/brainwsp
                      docker compose -f docker-compose.prod.yml pull
                      docker compose -f docker-compose.prod.yml up -d
                      docker image prune -f
                      docker compose -f docker-compose.prod.yml ps
